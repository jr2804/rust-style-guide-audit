[project]
name = "rust-style-guide-audit"
version = "2026.10.3"
description = "Agent skill and audit CLI that finds violations of the Google Rust Style Guide and proposes refactors."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jan Reimes" }]
keywords = ["rust", "style-guide", "lint", "audit", "agent-skill"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
# The scripts are PEP 723 self-contained and import nothing outside the standard library;
# this environment exists for the tests and the linters, not for the audit itself.
dependencies = []

[project.urls]
Homepage = "https://github.com/jr2804/rust-style-guide-audit"
Upstream = "https://google.github.io/styleguide/rustguide.html"

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "skills/rust-style-guide-audit/scripts"]
cache_dir = "tmp/pytest-cache"
addopts = "-v --tb=short"
